name: Validate catalog and site

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      external_links:
        description: Run a separate public HTTP availability audit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify generated output
        run: python3 scripts/build_site.py --check
      - name: Validate Markdown, links, language parity and metadata
        run: python3 scripts/check_content.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate original evaluation pack
        run: python3 evaluations/tools/validate.py validate

  external-links:
    if: github.event_name == 'workflow_dispatch' && inputs.external_links
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit public HTTP availability
        run: python3 scripts/check_links.py --output reports/link-check.json
      - name: Preserve availability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-link-audit
          path: reports/link-check.json
          if-no-files-found: error
          retention-days: 14
